[project]
name = "overnight-intraday-br"
version = "0.1.0"
description = "Retornos overnight vs intraday na B3: a anomalia de Knuteson testada no Brasil"
readme = "README.md"
authors = [
    { name = "joao" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[project.optional-dependencies]
# O executor fala com a corretora pelo MetaTrader 5, que só existe no Windows: uv sync --extra mt5
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "overnight_br"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
